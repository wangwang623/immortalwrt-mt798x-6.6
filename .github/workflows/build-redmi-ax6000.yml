# ==============================================================================
# Redmi AX6000 固件编译（hanwckf U-Boot / 110M 大分区）
#
# 源码：本仓库自身（wangwang623/immortalwrt-mt798x-6.6）
# 目标：xiaomi_redmi-router-ax6000-ubootmod
#
# 关键事实（已核对源码，非推测）：
#   padavanonly 的 ax6000-ubootmod DTS 里 ubi = <0x600000 0x6e00000> = 110 MiB
#   并保留 crash / crash_log、启用 mediatek,nmbm
#   → 与 hanwckf bl-mt798x U-Boot 的 "immortalwrt-110m" 布局完全一致
#   → 与官方 OpenWrt 的 ubootmod（0x580000 / 122.5M / 无 nmbm）不是一回事
#
# 产物（该机型定义里没有 factory.bin）：
#   *-initramfs-factory.ubi   ← 首次刷入用这个（U-Boot Web 恢复界面上传）
#   *-squashfs-sysupgrade.bin ← 进系统后日常升级
# ==============================================================================

name: Build Redmi AX6000 (hanwckf U-Boot 110M)

on:
  workflow_dispatch:

  # workflow_call:            # 需要被其它 workflow 调用时取消注释
  #   inputs: { ... }
  # schedule:
  #   - cron: '0 20 * * 0'    # 每周日 UTC 20:00 自动构建

permissions:
  contents: write

env:
  TZ: 'Asia/Shanghai'
  # 必开的 RootFS 类型：
  #   INITRAMFS —— ax6000-ubootmod 的 initramfs-factory.ubi 依赖 initramfs-recovery.itb
  #   SQUASHFS  —— sysupgrade.bin 依赖
  ROOTFS_TYPES: 'initramfs squashfs'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ---------------------------------------------------------------- ① 取源码
      # 本 workflow 就放在源码仓库里，直接构建自身，无需再克隆上游
      - name: ① 检出源码
        uses: actions/checkout@v5
        with:
          ref: openwrt-24.10-6.6
          fetch-depth: 1

      # ---------------------------------------------------------------- ② 环境
      - name: ② 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl ccache
          sudo apt-get clean

      - name: ②-b 释放磁盘空间
        run: |
          df -h / || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / || true

      # ---------------------------------------------------------------- ③ feeds
      # 必须在 make defconfig 之前：LuCI 等包来自 feeds
      - name: ③ 更新并安装 feeds
        run: |
          # 清理上传残留：target/base-files 里的 99-default-settings 与
          # package/emortal/default-settings 提供的同名文件冲突，会让
          # package/install 失败。默认设置已由 zz-custom-settings 提供。
          rm -f target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-default-settings
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------------------------------------------------------- ④ 配置
      - name: ④ 载入配置
        run: |
          CFG="defconfig/ax6000-hanwckf-110m.config"
          [ -f "$CFG" ] || { echo "::error::配置文件不存在: $CFG"; exit 1; }
          cp "$CFG" .config

          # 强制打开 RootFS 类型（AX6000 ubootmod 的 .ubi 产物依赖 initramfs）
          for t in $ROOTFS_TYPES; do
            sed -i "s/^# CONFIG_TARGET_ROOTFS_$(echo $t | tr a-z A-Z) is not set/CONFIG_TARGET_ROOTFS_$(echo $t | tr a-z A-Z)=y/" .config
            grep -q "^CONFIG_TARGET_ROOTFS_$(echo $t | tr a-z A-Z)=" .config || \
              echo "CONFIG_TARGET_ROOTFS_$(echo $t | tr a-z A-Z)=y" >> .config
          done

          make defconfig
          ./scripts/diffconfig.sh > config.buildinfo

      # ---------------------------------------------------------------- ⑤ 校验
      - name: ⑤ 校验配置（硬中止 / 软警告）
        run: |
          # 硬：目标 / RootFS / 21 项最小系统主包与直接依赖 / MT7986 芯片宏
          HARD=(
            CONFIG_TARGET_mediatek
            CONFIG_TARGET_mediatek_filogic
            CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-ubootmod
            CONFIG_TARGET_ROOTFS_INITRAMFS
            CONFIG_TARGET_ROOTFS_SQUASHFS
            CONFIG_PACKAGE_kmod-mt_wifi
            CONFIG_PACKAGE_kmod-mediatek_hnat
            CONFIG_PACKAGE_luci
            CONFIG_PACKAGE_opkg
            CONFIG_PACKAGE_zram-swap
            CONFIG_PACKAGE_kmod-lib-lzo
            CONFIG_PACKAGE_wifi-dats
            CONFIG_PACKAGE_kmod-conninfra
            CONFIG_PACKAGE_kmod-warp
            CONFIG_PACKAGE_kmod-nf-conntrack
            CONFIG_PACKAGE_wireless-tools
            CONFIG_PACKAGE_luci-light
            CONFIG_PACKAGE_luci-app-package-manager
            CONFIG_PACKAGE_uclient-fetch
            CONFIG_PACKAGE_libpthread
            CONFIG_PACKAGE_libubox
            CONFIG_PACKAGE_kmod-zram
            CONFIG_PACKAGE_kmod-crypto-acompress
            CONFIG_PACKAGE_mtwifi-cfg
            CONFIG_PACKAGE_iwinfo
            CONFIG_PACKAGE_datconf-lua
            CONFIG_MTK_CHIP_MT7986
            CONFIG_MTK_CONNINFRA_APSOC
            CONFIG_MTK_CONNINFRA_APSOC_MT7986
            CONFIG_MTK_FIRST_IF_MT7986
            CONFIG_MTK_MT7986_NEW_FW
          )
          HARD_KV=(
            'CONFIG_WARP_CHIPSET="mt7986"'
            'CONFIG_first_card_name="MT7986"'
          )
          # 软：中文 / Argon / lz4 主包，缺了只警告，继续编译
          SOFT=(
            CONFIG_PACKAGE_luci-i18n-base-zh-cn
            CONFIG_PACKAGE_luci-theme-argon
            CONFIG_PACKAGE_kmod-lib-lz4
          )
          fail=0
          for s in "${HARD[@]}"; do
            grep -qx "${s}=y" .config || { echo "  ✗ ${s}  ← 未生效！"; fail=1; }
          done
          for kv in "${HARD_KV[@]}"; do
            grep -qxF "$kv" .config || { echo "  ✗ ${kv}  ← 未生效！"; fail=1; }
          done
          # 反向：7981 芯片宏绝不出现
          if grep -qE '^CONFIG_MTK_(CHIP_MT7981|CONNINFRA_APSOC_MT7981|FIRST_IF_MT7981)=' .config; then
            echo "  ✗ 检测到 MT7981 芯片宏，与 AX6000(MT7986) 冲突！"; fail=1
          fi
          [ "$fail" -eq 0 ] || {
            echo "::error::配置校验未通过（机型符号或驱动包在源码中不存在）"
            grep -oE "TARGET_DEVICES \+= [a-zA-Z0-9_-]+" \
              target/linux/mediatek/image/filogic.mk | grep -i ax6000 || true
            exit 1
          }
          echo "[OK] 硬校验通过"
          for s in "${SOFT[@]}"; do
            grep -qx "${s}=y" .config || echo "::warning::${s} 未选中（可后装/可选，继续编译）"
          done

      # ---------------------------------------------------------------- ⑥ 下载
      - name: ⑥ 下载源码包
        run: make download -j8

      - name: ⑥-b 校验下载完整性
        run: |
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \; 2>/dev/null || true
          make download -j8

      # ---------------------------------------------------------------- ⑦ 编译
      - name: ⑦ 编译固件
        id: compile
        run: |
          echo "nproc = $(nproc)"
          make -j$(nproc) || { echo "并行编译失败，改单线程重跑"; make -j1 V=s; }

      - name: ⑦-b 失败时诊断
        if: failure()
        run: |
          echo "── 磁盘 ──"; df -h || true
          echo "── 各阶段体积 ──"; du -sh build_dir staging_dir dl 2>/dev/null || true
          echo "── 最近错误行 ──"
          make -j1 V=s 2>&1 | grep -iE "error|Error [0-9]|No rule to make" | tail -30 || true

      # ---------------------------------------------------------------- ⑧ 收产物
      - name: ⑧ 收集产物
        id: collect
        run: |
          OUT="$GITHUB_WORKSPACE/firmware"
          mkdir -p "$OUT"
          find bin/targets -type f \( \
              -name '*.ubi' -o -name '*.itb' -o -name '*.bin' \
              -o -name '*.buildinfo' -o -name '*.manifest' -o -name 'sha256sums' \
            \) -exec cp -v {} "$OUT"/ \;
          cp config.buildinfo "$OUT"/ 2>/dev/null || true

          echo "── 产物清单 ──"
          ls -lh "$OUT"

          # 必查：initramfs-factory.ubi 是 hanwckf U-Boot 首次刷入的关键文件
          if ! ls "$OUT"/*initramfs-factory.ubi >/dev/null 2>&1; then
            echo "::error::缺少 initramfs-factory.ubi —— 请确认 CONFIG_TARGET_ROOTFS_INITRAMFS=y 已生效"
            exit 1
          fi
          echo "firmware_dir=$OUT" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- ⑨ 上传
      - name: ⑨ 上传 Artifacts
        # v6 起运行在 Node 24，规避 Node 20 弃用告警
        # 注意：不要写不存在的版本号（如 v7.x 目前未发布），否则本步直接失败
        uses: actions/upload-artifact@v6
        with:
          name: redmi-ax6000-hanwckf-110m
          path: ${{ steps.collect.outputs.firmware_dir }}/*
          if-no-files-found: error

      - name: ⑨-b 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ax6000-${{ github.run_number }}
          name: 'Redmi AX6000 (hanwckf U-Boot 110M) #${{ github.run_number }}'
          body: |
            ## Redmi AX6000 · hanwckf U-Boot 110M 布局

            - 机型: `xiaomi_redmi-router-ax6000-ubootmod`
            - 驱动: `闭源 mt_wifi`（本源码无开源 mt76，已核实）
            - 源码: `openwrt-24.10-6.6` @ `${{ github.sha }}`
            - 分区: ubi = `0x600000` + `0x6e00000` (110 MiB)，保留 crash/crash_log，启用 nmbm

            ### 刷机顺序
            1. 进 hanwckf U-Boot Web 恢复界面（断电按住 Reset 上电）
            2. **布局选 `immortalwrt-110m`**（不是 default）
            3. 上传 `*-initramfs-factory.ubi` → 开机进入 initramfs
            4. 在系统内 `sysupgrade -n *-squashfs-sysupgrade.bin`

            ### 验证
            ```
            cat /proc/mtd      # ubi 应为 06e00000
            ```
          files: ${{ steps.collect.outputs.firmware_dir }}/*
